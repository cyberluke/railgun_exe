name: railgun-build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  OXC_SHA: 1aa5ec11ce0dcbb0da7799e777c2492211908fbb
  TSGOLINT_SHA: f78270df91ea025daf9a8ccb36e6051621dac6f1

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: ${{ env.OXC_SHA }}
          path: oxc
      - uses: actions/checkout@v4
        with:
          repository: oxc-project/tsgolint
          ref: ${{ env.TSGOLINT_SHA }}
          path: tsgolint
          submodules: recursive
      - name: apply patches
        working-directory: tsgolint
        run: |
          Get-ChildItem patches/*.patch | ForEach-Object { git -C typescript-go am --3way --no-gpg-sign $_.FullName }
      - name: copy Go collections
        working-directory: tsgolint
        run: |
          New-Item -ItemType Directory -Force internal\collections | Out-Null
          Get-ChildItem typescript-go/internal/collections/*.go -File |
            Where-Object { $_.Name -notlike '*_test.go' } |
            ForEach-Object { Copy-Item $_.FullName internal\collections\ -Force }
      - uses: dtolnay/rust-toolchain@stable
      - name: build native
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3'
          cargo build --release -p oxlint --features allocator
          New-Item -ItemType Directory -Force ..\dist\win32-x64 | Out-Null
          Copy-Item target\release\oxlint.exe ..\dist\win32-x64\railgun-native.exe -Force
      - name: build PGO
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3 -Cprofile-generate=pgo-profile'
          cargo build --release -p oxlint --features allocator --target-dir target-pgo
          1..5 | ForEach-Object { .\target-pgo\release\oxlint.exe apps/oxlint/fixtures }
          $profdata = (Get-ChildItem pgo-profile\*.profraw | ForEach-Object FullName)
          $sysroot = (& rustc --print sysroot)
          & "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\bin\llvm-profdata.exe" merge -o pgo-profile\merged.profdata $profdata
          $merged = (Resolve-Path pgo-profile\merged.profdata).Path
          $env:RUSTFLAGS = "-C target-cpu=x86-64-v3 -Cprofile-use=$merged"
          cargo build --release -p oxlint --features allocator --target-dir target-pgo-final
          Copy-Item target-pgo-final\release\oxlint.exe ..\dist\win32-x64\railgun.exe -Force
          Copy-Item target-pgo-final\release\oxlint.exe ..\dist\win32-x64\railgun-pgo.exe -Force
      - name: build lld
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3 -C linker=rust-lld'
          cargo build --release -p oxlint --features allocator
          Copy-Item target\release\oxlint.exe ..\dist\win32-x64\railgun-lld.exe -Force
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build tsgolint (PGO)
        working-directory: tsgolint
        run: |
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:GOAMD64='v3'
          go test -cpuprofile pgo\cpu.prof -run '^$' -bench . .\cmd\tsgolint
          Copy-Item pgo\cpu.prof cmd\tsgolint\default.pgo -Force
          go build -trimpath -ldflags='-s -w' -o ..\dist\win32-x64\railgun-ts.exe .\cmd\tsgolint
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/win32-x64
