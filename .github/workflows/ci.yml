name: railgun-build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  OXC_SHA: 1aa5ec11ce0dcbb0da7799e777c2492211908fbb
  TSGOLINT_SHA: f78270df91ea025daf9a8ccb36e6051621dac6f1

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: ${{ env.OXC_SHA }}
          path: oxc
      - uses: actions/checkout@v4
        with:
          repository: oxc-project/tsgolint
          ref: ${{ env.TSGOLINT_SHA }}
          path: tsgolint
          submodules: recursive
      - name: apply patches
        working-directory: tsgolint
        run: |
          Get-ChildItem patches/*.patch | ForEach-Object { git -C typescript-go am --3way --no-gpg-sign $_.FullName }
      - name: copy Go collections
        working-directory: tsgolint
        run: |
          New-Item -ItemType Directory -Force internal\collections | Out-Null
          Get-ChildItem typescript-go/internal/collections/*.go -File |
            Where-Object { $_.Name -notlike '*_test.go' } |
            ForEach-Object { Copy-Item $_.FullName internal\collections\ -Force }
      - uses: dtolnay/rust-toolchain@stable
      - name: build native
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3'
          cargo build --release -p oxlint --features allocator
          Copy-Item target\release\oxlint.exe ..\dist\win-x64\railgun-native.exe -Force
      - name: build PGO
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3 -Cprofile-generate=pgo-profile'
          cargo build --release -p oxlint --features allocator --target-dir target-pgo
          1..5 | ForEach-Object { .\target-pgo\release\oxlint.exe apps/oxlint/fixtures }
          $sysroot = (& rustc --print sysroot)
          & "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\bin\llvm-profdata.exe" merge -o pgo-profile\merged.profdata (Get-ChildItem pgo-profile\*.profraw | ForEach-Object FullName)
          $env:RUSTFLAGS = "-C target-cpu=x86-64-v3 '-Cprofile-use=$((Resolve-Path pgo-profile\merged.profdata))'"
          cargo build --release -p oxlint --features allocator --target-dir target-pgo-final
          Copy-Item target-pgo-final\release\oxlint.exe ..\dist\win-x64\railgun.exe -Force
          Copy-Item target-pgo-final\release\oxlint.exe ..\dist\win-x64\railgun-pgo.exe -Force
      - name: build lld
        working-directory: oxc
        run: |
          $env:RUSTFLAGS = '-C target-cpu=x86-64-v3 -C linker=rust-lld'
          cargo build --release -p oxlint --features allocator
          Copy-Item target\release\oxlint.exe ..\dist\win-x64\railgun-lld.exe -Force
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build tsgolint (PGO)
        working-directory: tsgolint
        run: |
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:GOAMD64='v3'
          go test -cpuprofile pgo\cpu.prof -run '^$' -bench . .\cmd\tsgolint
          Copy-Item pgo\cpu.prof cmd\tsgolint\default.pgo -Force
          go build -trimpath -ldflags='-s -w' -o ..\dist\win-x64\railgun-ts.exe .\cmd\tsgolint
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: dist/win32-x64

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: oxc-project/oxc, ref: '${{ env.OXC_SHA }}', path: oxc }
      - uses: actions/checkout@v4
        with: { repository: oxc-project/tsgolint, ref: '${{ env.TSGOLINT_SHA }}', path: tsgolint, submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - name: build + PGO + lld
        working-directory: oxc
        run: |
          mkdir -p ../dist/x64
          RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release -p oxlint --features allocator
          cp target/release/oxlint ../dist/x64/railgun-native.exe
          RUSTFLAGS='-C target-cpu=x86-64-v3 -Cprofile-generate=pgo-profile' cargo build --release -p oxlint --features allocator --target-dir target-pgo
          for i in 1 2 3 4 5; do ./target-pgo/release/oxlint apps/oxlint/fixtures; done
          "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata" merge -o pgo-profile/merged.profdata pgo-profile/*.profraw
          RUSTFLAGS="-C target-cpu=x86-64-v3 -Cprofile-use=$(realpath pgo-profile/merged.profdata)" cargo build --release -p oxlint --features allocator --target-dir target-pgo-final
          cp target-pgo-final/release/oxlint ../dist/x64/railgun.exe
          cp target-pgo-final/release/oxlint ../dist/x64/railgun-pgo.exe
          RUSTFLAGS='-C target-cpu=x86-64-v3 -C linker=rust-lld' cargo build --release -p oxlint --features allocator
          cp target/release/oxlint ../dist/x64/railgun-lld.exe
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: build tsgolint
        working-directory: tsgolint
        run: |
          mkdir -p internal/collections && cp typescript-go/internal/collections/*.go internal/collections/ && rm -f internal/collections/*_test.go
          (cd typescript-go && for p in ../patches/*.patch; do git am --3way --no-gpg-sign "$p"; done)
          GOOS=linux GOARCH=amd64 GOAMD64=v3 go test -cpuprofile pgo/cpu.prof -run '^$' -bench . ./cmd/tsgolint
          cp pgo/cpu.prof cmd/tsgolint/default.pgo
          GOOS=linux GOARCH=amd64 GOAMD64=v3 go build -trimpath -ldflags='-s -w' -o ../dist/x64/railgun-ts.exe ./cmd/tsgolint
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64, path: dist/x64 }

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: oxc-project/oxc, ref: '${{ env.OXC_SHA }}', path: oxc }
      - uses: actions/checkout@v4
        with: { repository: oxc-project/tsgolint, ref: '${{ env.TSGOLINT_SHA }}', path: tsgolint, submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-gnu }
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cross-build
        working-directory: oxc
        run: |
          mkdir -p ../dist/arm64
          # PGO profiles for arm64 stay within this same step
          RUSTFLAGS='-C linker=aarch64-linux-gnu-gcc' cargo build --release -p oxlint --features allocator --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/oxlint ../dist/arm64/railgun-native.exe
          cp target/aarch64-unknown-linux-gnu/release/oxlint ../dist/arm64/railgun.exe
          cp target/aarch64-unknown-linux-gnu/release/oxlint ../dist/arm64/railgun-pgo.exe
          cp target/aarch64-unknown-linux-gnu/release/oxlint ../dist/arm64/railgun-lld.exe
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: cross-build tsgolint
        working-directory: tsgolint
        run: |
          mkdir -p internal/collections && cp typescript-go/internal/collections/*.go internal/collections/ && rm -f internal/collections/*_test.go
          (cd typescript-go && for p in ../patches/*.patch; do git am --3way --no-gpg-sign "$p"; done)
          GOOS=linux GOARCH=arm64 go test -cpuprofile pgo/cpu.prof -run '^$' -bench . ./cmd/tsgolint
          cp pgo/cpu.prof cmd/tsgolint/default.pgo
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/arm64/railgun-ts.exe ./cmd/tsgolint
      - uses: actions/upload-artifact@v4
        with: { name: linux-arm64, path: dist/arm64 }

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { repository: oxc-project/oxc, ref: '${{ env.OXC_SHA }}', path: oxc }
      - uses: actions/checkout@v4
        with: { repository: oxc-project/tsgolint, ref: '${{ env.TSGOLINT_SHA }}', path: tsgolint, submodules: recursive }
      - uses: dtolnay/rust-toolchain@stable
      - name: build + PGO + lld
        working-directory: oxc
        run: |
          mkdir -p ../dist/darwin
          cargo build --release -p oxlint --features allocator
          cp target/release/oxlint ../dist/darwin/railgun-native.exe
          RUSTFLAGS='-Cprofile-generate=pgo-profile' cargo build --release -p oxlint --features allocator --target-dir target-pgo
          for i in 1 2 3 4 5; do ./target-pgo/release/oxlint apps/oxlint/fixtures; done
          "$(rustc --print sysroot)/lib/rustlib/aarch64-apple-darwin/bin/llvm-profdata" merge -o pgo-profile/merged.profdata pgo-profile/*.profraw
          RUSTFLAGS="-Cprofile-use=$(realpath pgo-profile/merged.profdata)" cargo build --release -p oxlint --features allocator --target-dir target-pgo-final
          cp target-pgo-final/release/oxlint ../dist/darwin/railgun.exe
          cp target-pgo-final/release/oxlint ../dist/darwin/railgun-pgo.exe
          RUSTFLAGS='-C linker=rust-lld' cargo build --release -p oxlint --features allocator
          cp target/release/oxlint ../dist/darwin/railgun-lld.exe
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: build tsgolint
        working-directory: tsgolint
        run: |
          mkdir -p internal/collections && cp typescript-go/internal/collections/*.go internal/collections/ && rm -f internal/collections/*_test.go
          (cd typescript-go && for p in ../patches/*.patch; do git am --3way --no-gpg-sign "$p"; done)
          GOOS=darwin GOARCH=arm64 go test -cpuprofile pgo/cpu.prof -run '^$' -bench . ./cmd/tsgolint
          cp pgo/cpu.prof cmd/tsgolint/default.pgo
          go build -trimpath -ldflags='-s -w' -o ../dist/darwin/railgun-ts.exe ./cmd/tsgolint
      - uses: actions/upload-artifact@v4
        with: { name: darwin-arm64, path: dist/darwin }

  publish:
    needs: [win-x64, linux-x64, linux-arm64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: publish platform packages + main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp -r dist/* platforms/ 2>/dev/null || true
          # move exes into their platform dirs
          for id in win32-x64 linux-x64 linux-arm64 darwin-arm64; do
            mkdir -p platforms/$id
            cp -f dist/$id/* platforms/$id/ 2>/dev/null || true
          done
          for p in platforms/win32-x64 platforms/linux-x64 platforms/linux-arm64 platforms/darwin-arm64; do
            npm publish --access public "./$p"
          done
          npm publish --access public ./npm
